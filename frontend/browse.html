<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Items | Campus Lost & Found</title>
    <link rel="stylesheet" href="style/browse.css">
    <script src="js/browse.js" defer></script>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">Campus Lost & Found</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html" class="active">Browse Items</a>
            <a href="report.html">Report an Item</a>
            <a href="claims.html">Incoming Claims</a>
            <button id="logoutBtn" type="button">Logout</button>
        </nav>
    </header>

    <main class="container">
        <section class="page-heading">
            <p class="eyebrow">RECONNECT WITH WHAT MATTERS</p>
            <h1>Lost something?</h1>
            <p>Browse reports from your campus community.</p>
        </section>

        <section class="filters">
            <input
                type="search"
                id="searchInput"
                placeholder="Search items..."
                aria-label="Search items"
            >

            <select id="typeFilter" aria-label="Filter by item type">
                <option value="ALL">All items</option>
                <option value="LOST">Lost items</option>
                <option value="FOUND">Found items</option>
            </select>

            <button id="searchBtn" type="button">Search</button>
        </section>

        <p id="message" role="status" aria-live="polite"></p>

        <section id="reportsContainer" class="reports-grid"
                 aria-label="Reported items">
            <!-- Report cards are rendered here by browse.js -->
        </section>
    </main>
</body>
</html>
