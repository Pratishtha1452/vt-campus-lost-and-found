
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lost & Found</title>
  <script src="../js/app.js" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style/home.css">
</head>
<body>
  <div class="bg-container">
    <img
      src="../images/backgrounds/bg4.jpg"
      alt="Illustrated city street"
      class="bg"
    >


<div class="hero-content">
  <h1 class="typing-title">
    <span class="typing-text">LOST &amp; FOUND</span><span class="cursor" aria-hidden="true"></span>
  </h1>

  <p class="hero-subtitle">
    Lost something? Let's bring it back.
  </p>

  <div class="hero-buttons">
    <button type="button" id="reportBtn" class="hero-btn primary-btn">
      Report an Item
    </button>

    <button type="button" id="browseBtn" class="hero-btn secondary-btn">
      Browse Items
    </button>
  </div>
</div>

  </div>
